name: build-twrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 720
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" /usr/local/lib/node_modules
          df -h /

      - name: 安装依赖
        run: |
          # runner 已预装 git / curl / python3 / zip / Java，只补 TWRP 构建缺的两个
          for i in 1 2 3 4 5; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq --fix-missing rsync bc; then
              echo "依赖就绪"; break
            fi
            echo "::warning::apt 第 $i 次失败，10 秒后重试"; sleep 10
            [ "$i" = "5" ] && { echo "::error::依赖安装失败"; exit 1; }
          done
          # repo 工具（manifest 同步必需）
          mkdir -p ~/bin
          curl -s -o ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod 755 ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          ~/bin/repo --version | head -1
          java -version 2>&1 | head -1
          git --version
          python3 --version

      - name: 同步 TWRP manifest
        run: |
          mkdir -p ~/tw && cd ~/tw
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
                    -b twrp-14.1 --depth=1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags 2>&1 | tail -20
          df -h /

      - name: 放入最小设备树
        run: |
          cd ~/tw
          mkdir -p device/realme
          cp -r "$GITHUB_WORKSPACE/device/realme/RE6025L1" device/realme/
          ls -la device/realme/RE6025L1/

      - name: 移除 TWRP 用不到且缺依赖的树
        run: |
          cd ~/tw
          # 这些是测试框架 / 模拟器 / AVF 的代码，TWRP 不需要，
          # 但最小 manifest 没同步它们的 defaults 模块，Soong 会报 undefined module。
          # 这些都是测试 / 与 recovery 无关的代码，最小 manifest 没同步它们的
          # defaults 模块，留着会让 Soong 报 undefined module。
          for d in tools/tradefederation hardware/google/aemu hardware/google/gfxstream \
                   system/secretkeeper packages/modules/AVF \
                   test tools/loganalysis packages/modules/AdServices \
                   packages/modules/Connectivity cts; do
            [ -d "$d" ] && { echo "  移除 $d"; rm -rf "$d"; }
          done
          df -h / | tail -1

      - name: 构建 recovery
        run: |
          cd ~/tw
          echo "===== 诊断 ====="
          echo "-- vendor/twrp 是否存在 --"
          ls -d vendor/twrp vendor/twrp/config 2>/dev/null || echo "  vendor/twrp 缺失"
          ls vendor/twrp/config/common.mk 2>/dev/null || echo "  common.mk 缺失"
          echo "-- 设备树 --"
          ls device/realme/RE6025L1/
          echo "-- AndroidProducts.mk --"
          cat device/realme/RE6025L1/AndroidProducts.mk
          echo "===== 尝试 lunch ====="
          source build/envsetup.sh
          print_lunch_menu 2>/dev/null | grep -i twrp | head -10 || echo "  菜单里没有 twrp 条目"
          set +e
          echo "===== 完整午餐菜单（不过滤）====="
          print_lunch_menu 2>&1 | head -60
          echo "===== lunch 真实退出码 ====="
          lunch twrp_RE6025L1-ap2a-userdebug > /tmp/lunch.log 2>&1
          RC=$?
          echo "lunch rc=$RC"
          tail -30 /tmp/lunch.log
          echo "-- lunch 后的变量 --"
          echo "TARGET_PRODUCT=[$(get_build_var TARGET_PRODUCT 2>/dev/null)]"
          echo "TARGET_RELEASE=[$(get_build_var TARGET_RELEASE 2>/dev/null)]"
          echo "TARGET_BUILD_VARIANT=[$(get_build_var TARGET_BUILD_VARIANT 2>/dev/null)]"
          echo "-- TARGET_RELEASE 是否 readonly --"
          echo "RELEASE_CONFIG_MAP=[$(get_build_var RELEASE_CONFIG_MAP 2>/dev/null)]"
          echo "===== 若失败，直接解析产品 .mk 看错在哪 ====="
          if [ "$RC" -ne 0 ]; then
            echo "-- 逐个 inherit 目标是否存在 --"
            for f in               "$(gettop)/build/make/target/product/base.mk"               "$(gettop)/device/realme/RE6025L1/device.mk"               "$(gettop)/vendor/twrp/config/common.mk"; do
              [ -f "$f" ] && echo "  ✓ $f" || echo "  ✗ 缺失 $f"
            done
            echo "-- TARGET_PRODUCT 相关 --"
            build/soong/soong_ui.bash --dumpvar-mode TARGET_PRODUCT 2>&1 | head -10
            echo "-- print_lunch_menu 全部 --"
            print_lunch_menu 2>&1 | head -30
            echo "::error::lunch 失败，上面是完整诊断"
            exit 1
          fi
          # AOSP 14+ 需要 TARGET_RELEASE；lunch 没带上，这里显式传
          # 最小 manifest 没同步全部仓库，Soong 会报一堆 undefined module；
          # 让 Soong 跳过缺失依赖（TWRP 官方构建的常规做法）
          export TARGET_RELEASE=ap2a
          echo "TARGET_RELEASE=$TARGET_RELEASE"
          # 先列出真实的 ramdisk 类目标名，别再猜
          echo "===== 检查 system/security（android.security.apc 的来源）====="
          ls -d ~/tw/system/security 2>/dev/null && echo "  ✓ system/security 存在" || echo "  ✗ system/security 不存在"
          ls ~/tw/system/security/apc/ 2>/dev/null | head -8
          find ~/tw/system/security -name "Android.bp" 2>/dev/null | head -5
          grep -rn "android.security.apc" ~/tw/system/security/*/Android.bp 2>/dev/null | head -5
          echo "===== 开始构建 ====="
          mka recovery 2>&1 | tail -40
          echo "=== 产物清单 ==="
          find out/target/product/RE6025L1 -maxdepth 2 \( -name '*.img' -o -name 'ramdisk*' \) -exec ls -lh {} \; 2>/dev/null | head -20
          IMG=$(find out/target/product/RE6025L1 -maxdepth 1 -name 'vendor_boot*.img' | head -1)
          if [ -n "$IMG" ]; then
            echo "✅ 产物: $IMG"
          else
            echo "::error::没有 vendor_boot 镜像，列出 out 目录："
            ls -lh out/target/product/RE6025L1/ 2>/dev/null | head -30
            exit 1
          fi

      - name: 收集产物到工作区
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp -v ~/tw/out/target/product/RE6025L1/vendor_boot*.img "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          cp -v ~/tw/out/target/product/RE6025L1/*ramdisk* "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          echo "=== out 目录里所有 ramdisk 相关文件 ==="
          find ~/tw/out -name '*ramdisk*' -o -name '*recovery*' 2>/dev/null | head -20
          echo "=== 把这些都拷过来（如果有）==="
          find ~/tw/out -name '*ramdisk*' -type f -size +100k 2>/dev/null | while read f; do
            cp -v "$f" "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          done
          # 从 recovery.img 里抽出 ramdisk（这才是完整的 TWRP 根目录）
          RIMG=~/tw/out/target/product/RE6025L1/recovery.img
          if [ -f "$RIMG" ]; then
            echo "=== recovery.img 存在 $(stat -c %s "$RIMG") 字节，抽出 ramdisk ==="
            MB=$(ls ~/tw/external/magisk-prebuilt/*/magiskboot 2>/dev/null | head -1)
            [ -z "$MB" ] && MB=$(find ~/tw/out -name magiskboot -type f 2>/dev/null | head -1)
            if [ -n "$MB" ]; then
              mkdir -p /tmp/rx && cd /tmp/rx && cp "$RIMG" . && "$MB" unpack recovery.img >/dev/null 2>&1
              ls -lh /tmp/rx
              [ -f /tmp/rx/ramdisk.cpio ] && cp /tmp/rx/ramdisk.cpio "$GITHUB_WORKSPACE/out/ramdisk-twrp.cpio" && \
                echo "  ✅ ramdisk-twrp.cpio $(stat -c %s "$GITHUB_WORKSPACE/out/ramdisk-twrp.cpio") 字节"
            else
              echo "::warning::找不到 magiskboot"
            fi
          else
            echo "::warning::没有 recovery.img"
            ls -lh ~/tw/out/target/product/RE6025L1/*.img 2>/dev/null
          fi
          # 兜底：仍然打包 recovery/root
          RR=~/tw/out/target/product/RE6025L1/recovery/root
          if [ -d "$RR" ]; then
            echo "=== 打包 recovery/root → cpio ==="
            ( cd "$RR" && find . -print0 | cpio --null -o -H newc 2>/dev/null | gzip -9 ) \
              > "$GITHUB_WORKSPACE/out/ramdisk-recovery-twrp.cpio.gz"
            ls -lh "$GITHUB_WORKSPACE/out/ramdisk-recovery-twrp.cpio.gz"
            echo "  内容条目数: $( ( cd "$RR" && find . | wc -l ) )"
          else
            echo "::warning::recovery/root 不存在，列出 out 结构"
            find ~/tw/out/target/product/RE6025L1 -maxdepth 2 -type d | head -20
          fi
          ls -lh "$GITHUB_WORKSPACE/out/"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: twrp-images
          path: out/
          if-no-files-found: error
