name: build-twrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 720
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" /usr/local/lib/node_modules
          df -h /

      - name: 安装依赖
        run: |
          # runner 已预装 git / curl / python3 / zip / Java，只补 TWRP 构建缺的两个
          for i in 1 2 3 4 5; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq --fix-missing rsync bc; then
              echo "依赖就绪"; break
            fi
            echo "::warning::apt 第 $i 次失败，10 秒后重试"; sleep 10
            [ "$i" = "5" ] && { echo "::error::依赖安装失败"; exit 1; }
          done
          # repo 工具（manifest 同步必需）
          mkdir -p ~/bin
          curl -s -o ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod 755 ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          ~/bin/repo --version | head -1
          java -version 2>&1 | head -1
          git --version
          python3 --version

      - name: 同步 TWRP manifest
        run: |
          mkdir -p ~/tw && cd ~/tw
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
                    -b twrp-14.1 --depth=1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags 2>&1 | tail -20
          df -h /

      - name: 放入最小设备树
        run: |
          cd ~/tw
          mkdir -p device/realme
          cp -r "$GITHUB_WORKSPACE/device/realme/RE6025L1" device/realme/
          ls -la device/realme/RE6025L1/

      - name: 移除 TWRP 用不到且缺依赖的树
        run: |
          cd ~/tw
          # 这些是测试框架 / 模拟器 / AVF 的代码，TWRP 不需要，
          # 但最小 manifest 没同步它们的 defaults 模块，Soong 会报 undefined module。
          for d in tools/tradefederation hardware/google/aemu hardware/google/gfxstream \
                   system/secretkeeper packages/modules/AVF; do
            [ -d "$d" ] && { echo "  移除 $d"; rm -rf "$d"; }
          done
          df -h / | tail -1

      - name: 构建 recovery
        run: |
          cd ~/tw
          echo "===== 诊断 ====="
          echo "-- vendor/twrp 是否存在 --"
          ls -d vendor/twrp vendor/twrp/config 2>/dev/null || echo "  vendor/twrp 缺失"
          ls vendor/twrp/config/common.mk 2>/dev/null || echo "  common.mk 缺失"
          echo "-- 设备树 --"
          ls device/realme/RE6025L1/
          echo "-- AndroidProducts.mk --"
          cat device/realme/RE6025L1/AndroidProducts.mk
          echo "===== 尝试 lunch ====="
          source build/envsetup.sh
          print_lunch_menu 2>/dev/null | grep -i twrp | head -10 || echo "  菜单里没有 twrp 条目"
          set +e
          echo "===== 完整午餐菜单（不过滤）====="
          print_lunch_menu 2>&1 | head -60
          echo "===== lunch 真实退出码 ====="
          lunch twrp_RE6025L1-ap2a-userdebug > /tmp/lunch.log 2>&1
          RC=$?
          echo "lunch rc=$RC"
          tail -30 /tmp/lunch.log
          echo "-- lunch 后的变量 --"
          echo "TARGET_PRODUCT=[$(get_build_var TARGET_PRODUCT 2>/dev/null)]"
          echo "TARGET_RELEASE=[$(get_build_var TARGET_RELEASE 2>/dev/null)]"
          echo "TARGET_BUILD_VARIANT=[$(get_build_var TARGET_BUILD_VARIANT 2>/dev/null)]"
          echo "-- TARGET_RELEASE 是否 readonly --"
          echo "RELEASE_CONFIG_MAP=[$(get_build_var RELEASE_CONFIG_MAP 2>/dev/null)]"
          echo "===== 若失败，直接解析产品 .mk 看错在哪 ====="
          if [ "$RC" -ne 0 ]; then
            echo "-- 逐个 inherit 目标是否存在 --"
            for f in               "$(gettop)/build/make/target/product/base.mk"               "$(gettop)/device/realme/RE6025L1/device.mk"               "$(gettop)/vendor/twrp/config/common.mk"; do
              [ -f "$f" ] && echo "  ✓ $f" || echo "  ✗ 缺失 $f"
            done
            echo "-- TARGET_PRODUCT 相关 --"
            build/soong/soong_ui.bash --dumpvar-mode TARGET_PRODUCT 2>&1 | head -10
            echo "-- print_lunch_menu 全部 --"
            print_lunch_menu 2>&1 | head -30
            echo "::error::lunch 失败，上面是完整诊断"
            exit 1
          fi
          # AOSP 14+ 需要 TARGET_RELEASE；lunch 没带上，这里显式传
          # 最小 manifest 没同步全部仓库，Soong 会报一堆 undefined module；
          # 让 Soong 跳过缺失依赖（TWRP 官方构建的常规做法）
          export SOONG_ALLOW_MISSING_DEPENDENCIES=true
          export TARGET_RELEASE=ap2a
          echo "TARGET_RELEASE=$TARGET_RELEASE"
          mka recoveryimage 2>&1 | tail -40
          echo "=== 产物清单 ==="
          find out/target/product/RE6025L1 -maxdepth 2 \( -name '*.img' -o -name 'ramdisk*' \) -exec ls -lh {} \; 2>/dev/null | head -20
          if [ -f out/target/product/RE6025L1/recovery.img ]; then
            echo "✅ recovery.img 已生成"
          else
            echo "::error::构建报告成功但没有 recovery.img，列出 out 目录："
            ls -lh out/target/product/RE6025L1/ 2>/dev/null | head -30
            exit 1
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: twrp-images
          path: |
            ~/tw/out/target/product/RE6025L1/recovery.img
            ~/tw/out/target/product/RE6025L1/ramdisk-recovery.img
          if-no-files-found: warn
